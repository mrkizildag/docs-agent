version: "2"

linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - ireturn
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - wrapcheck
  settings:
    depguard:
      rules:
        tests:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the stdlib and go-cmp
        # gate, llm, and agent are allow-lists (strict): a new internal package is
        # denied until it is added here.
        gate-domain:
          list-mode: strict
          files:
            - "**/internal/gate/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/review
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/llmrunner
              desc: gate imports only internal/review from this module
        review-contracts:
          files:
            - "**/internal/review/*.go"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal
              desc: internal/review imports nothing else from this module
        llm-agent-leaf:
          files:
            - "**/internal/llm/**"
            - "**/internal/agent/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/llm
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: read the environment only in internal/config
        - pattern: ^(os\.Exit|log\.Fatal.*)$
          msg: only main exits
        - pattern: ^http\.(Get|Post|DefaultClient)$
          msg: inject an *http.Client with a timeout
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        - github.com/mrkizildag/pollux-agent/backend/internal/review.Started
        - github.com/mrkizildag/pollux-agent/backend/internal/review.Verdict
  exclusions:
    rules:
      - path: internal/config/
        linters: [forbidigo]
        text: os\.(Getenv|LookupEnv)
      - path: cmd/
        linters: [forbidigo]
        text: os\.Exit
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mrkizildag/pollux-agent
