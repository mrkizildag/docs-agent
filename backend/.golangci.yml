version: "2"

linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - ireturn
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - wrapcheck
  settings:
    depguard:
      rules:
        tests:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the stdlib and go-cmp
        gate-domain:
          files:
            - "**/internal/gate/*.go"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/agent
              desc: gate imports only internal/review from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/config
              desc: gate imports only internal/review from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/github
              desc: gate imports only internal/review from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/httpapi
              desc: gate imports only internal/review from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/jobqueue
              desc: gate imports only internal/review from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/llm
              desc: gate imports only internal/review from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/gate/sqlite
              desc: gate imports only internal/review from this module
        review-contracts:
          files:
            - "**/internal/review/*.go"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/agent
              desc: internal/review imports nothing else from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/config
              desc: internal/review imports nothing else from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/gate
              desc: internal/review imports nothing else from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/github
              desc: internal/review imports nothing else from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/httpapi
              desc: internal/review imports nothing else from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/jobqueue
              desc: internal/review imports nothing else from this module
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/llm
              desc: internal/review imports nothing else from this module
        llm-agent-leaf:
          files:
            - "**/internal/llm/**"
            - "**/internal/agent/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/review
              desc: llm and agent are provider and loop plumbing; they know no domain
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/gate
              desc: llm and agent are provider and loop plumbing; they know no domain
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/github
              desc: llm and agent are provider and loop plumbing; they know no domain
            - pkg: github.com/mrkizildag/docs-agent/backend/internal/config
              desc: llm and agent are provider and loop plumbing; they know no domain
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: read the environment only in internal/config
        - pattern: ^(os\.Exit|log\.Fatal.*)$
          msg: only main exits
        - pattern: ^http\.(Get|Post|DefaultClient)$
          msg: inject an *http.Client with a timeout
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        - github.com/mrkizildag/docs-agent/backend/internal/review.Started
        - github.com/mrkizildag/docs-agent/backend/internal/review.Verdict
  exclusions:
    rules:
      - path: internal/config/
        linters: [forbidigo]
        text: os\.(Getenv|LookupEnv)
      - path: cmd/
        linters: [forbidigo]
        text: os\.Exit
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mrkizildag/docs-agent
