version: "2"

linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - ireturn
    - nilerr
    - noctx
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testpackage
    - wrapcheck
  settings:
    depguard:
      rules:
        tests:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the stdlib and go-cmp
        # gate, llm, and agent are allow-lists (strict): a new internal package is
        # denied until it is added here.
        gate-domain:
          list-mode: strict
          files:
            - "**/internal/gate/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/review$
        review-contracts:
          files:
            - "**/internal/review/*.go"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal
              desc: internal/review imports nothing else from this module
        docs-leaf:
          files:
            - "**/internal/docs/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal
              desc: internal/docs imports no other internal package
        runners:
          files:
            - "**/internal/review/*/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/github
              desc: runners reach GitHub only through their own interfaces or a token func from cmd/server
        llm-agent-leaf:
          files:
            - "**/internal/llm/**"
            - "**/internal/agent/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/llm
        jobqueue-stdlib:
          list-mode: strict
          files:
            - "**/internal/jobqueue/**"
            - "!$test"
          allow:
            - $gostd
        jobs-deps:
          list-mode: strict
          files:
            - "**/internal/jobs/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/jobqueue$
            - github.com/mrkizildag/pollux-agent/backend/internal/gate$
        httpapi-deps:
          list-mode: strict
          files:
            - "**/internal/httpapi/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/gate$
            - github.com/mrkizildag/pollux-agent/backend/internal/jobqueue$
            - github.com/mrkizildag/pollux-agent/backend/internal/jobs$
        sqlite-deps:
          list-mode: strict
          files:
            - "**/internal/gate/sqlite/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/gate$
            - github.com/mrkizildag/pollux-agent/backend/internal/jobqueue$
            - github.com/mrkizildag/pollux-agent/backend/internal/review$
            - modernc.org/sqlite
        github-deps:
          list-mode: strict
          files:
            - "**/internal/github/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/docs$
            - github.com/mrkizildag/pollux-agent/backend/internal/gate$
            - github.com/mrkizildag/pollux-agent/backend/internal/review$
            - github.com/mrkizildag/pollux-agent/backend/internal/review/actions$
            - github.com/bradleyfalzon/ghinstallation/v2
            - github.com/google/go-github
        config-only-cmd:
          files:
            - "**/internal/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/config
              desc: only cmd/ may import internal/config
        adapter-github:
          files:
            - "**/internal/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/github
              desc: concrete adapters are wired only in cmd/server
        adapter-sqlite:
          files:
            - "**/internal/**"
            - "!**/internal/gate/sqlite/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/gate/sqlite
              desc: concrete adapters are wired only in cmd/server
        adapter-llmrunner:
          files:
            - "**/internal/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/llmrunner
              desc: concrete adapters are wired only in cmd/server
        adapter-actions:
          files:
            - "**/internal/**"
            - "!**/internal/github/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/actions
              desc: only internal/github (and cmd/server) may import the Actions runner
        adapter-llm:
          files:
            - "**/internal/**"
            - "!**/internal/llm/**"
            - "!**/internal/agent/**"
            - "!**/internal/review/llmrunner/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/llm
              desc: only agent and llmrunner (and cmd/server) may import internal/llm
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(os\.(Getenv|LookupEnv|Environ|ExpandEnv)|syscall\.(Getenv|Environ))$
          msg: read the environment only in internal/config
        - pattern: ^(os\.Exit|log\.Fatal.*)$
          msg: only main exits
        - pattern: ^http\.(Get|Post|DefaultClient)$
          msg: inject an *http.Client with a timeout
    sloglint:
      forbidden-keys:
        - error
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        - generic
        - github.com/mrkizildag/pollux-agent/backend/internal/review.Started
        - github.com/mrkizildag/pollux-agent/backend/internal/review.ScaffoldStarted
        - github.com/mrkizildag/pollux-agent/backend/internal/review.Verdict
  exclusions:
    rules:
      - path: internal/config/
        linters: [forbidigo]
        text: read the environment only in internal/config
      - path: cmd/
        linters: [forbidigo]
        text: os\.Exit
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mrkizildag/pollux-agent
