name: pollux-agent
description: Review a pull request for documentation impact with Claude Code, or (pr_number 0) draft a repository's first docs from its default-branch code, and upload the result for the pollux-agent server.
inputs:
  head_sha:
    description: Head commit SHA of the pull request, or the default-branch tip when pr_number is 0.
    required: true
  pr_number:
    description: Pull request number. 0 selects scaffold mode.
    required: true
  nonce:
    description: Dispatch nonce, echoed back in the result.
    required: true
  docs:
    description: 'JSON object {"review": doc paths to review, "uncovered": changed files no doc covers}, chosen by the pollux-agent server. A bare array of doc paths to review is also accepted.'
    required: true
  claude_code_oauth_token:
    description: Claude subscription token. One of this or anthropic_api_key is required.
    required: false
  anthropic_api_key:
    description: Anthropic API key. One of this or claude_code_oauth_token is required.
    required: false
runs:
  using: composite
  steps:
    - name: Require a credential
      shell: bash
      env:
        OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        API_KEY: ${{ inputs.anthropic_api_key }}
      run: |
        if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
          echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret and pass it to the pollux-agent action."
          exit 1
        fi

    - name: Install Claude Code
      shell: bash
      working-directory: ${{ runner.temp }}
      run: npm install -g @anthropic-ai/claude-code@2.1.289

    - name: Check out the head
      uses: actions/checkout@v5
      with:
        path: pr
        ref: ${{ inputs.pr_number == '0' && inputs.head_sha || format('refs/pull/{0}/head', inputs.pr_number) }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify the head commit and write the diff
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CHECKOUT: ${{ github.workspace }}/pr
      run: |
        set -euo pipefail
        cd "$CHECKOUT"
        actual="$(git rev-parse HEAD)"
        if [ "$actual" != "$HEAD_SHA" ]; then
          echo "::error::Checked-out HEAD is $actual, expected $HEAD_SHA"
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/pollux-agent"
        [ "$PR_NUMBER" != "0" ] || exit 0
        git -c core.quotePath=false diff "origin/$DEFAULT_BRANCH...HEAD" > "$RUNNER_TEMP/pollux-agent/pr.diff"

    - name: Run Claude
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
        NONCE: ${{ inputs.nonce }}
        DOCS: ${{ inputs.docs }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ACTION_PATH: ${{ github.action_path }}
        CHECKOUT: ${{ github.workspace }}/pr
      run: bash "$ACTION_PATH/run-claude.sh"

    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pollux-agent-result
        path: ${{ runner.temp }}/pollux-agent/result.json
        if-no-files-found: ignore

    - name: Upload transcript
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pollux-agent-transcript
        path: ${{ runner.temp }}/pollux-agent/transcript.jsonl
        retention-days: 14
        if-no-files-found: ignore
