name: pollux-agent
description: Review a pull request for documentation impact with Claude Code, or (pr_number 0) draft a repository's first docs from its default-branch code, and upload the result for the pollux-agent server.
inputs:
  head_sha:
    description: Head commit SHA of the pull request, or the default-branch tip when pr_number is 0.
    required: true
  pr_number:
    description: Pull request number. 0 selects scaffold mode.
    required: true
  nonce:
    description: Dispatch nonce, echoed back in the result.
    required: true
  claude_code_oauth_token:
    description: Claude subscription token. One of this or anthropic_api_key is required.
    required: false
  anthropic_api_key:
    description: Anthropic API key. One of this or claude_code_oauth_token is required.
    required: false
runs:
  using: composite
  steps:
    - name: Require a credential
      shell: bash
      env:
        OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        API_KEY: ${{ inputs.anthropic_api_key }}
      run: |
        if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
          echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret and pass it to the pollux-agent action."
          exit 1
        fi

    - name: Install Claude Code
      shell: bash
      working-directory: ${{ runner.temp }}
      run: npm install -g @anthropic-ai/claude-code@2.1.289

    - name: Check out the head
      uses: actions/checkout@v5
      with:
        path: pr
        ref: ${{ inputs.pr_number == '0' && inputs.head_sha || format('refs/pull/{0}/head', inputs.pr_number) }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify the head commit and write the diff
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CHECKOUT: ${{ github.workspace }}/pr
      run: |
        set -euo pipefail
        cd "$CHECKOUT"
        actual="$(git rev-parse HEAD)"
        if [ "$actual" != "$HEAD_SHA" ]; then
          echo "::error::Checked-out HEAD is $actual, expected $HEAD_SHA"
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/pollux-agent"
        [ "$PR_NUMBER" != "0" ] || exit 0
        git diff "origin/$DEFAULT_BRANCH...HEAD" > "$RUNNER_TEMP/pollux-agent/pr.diff"

    - name: Run Claude
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
        NONCE: ${{ inputs.nonce }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ACTION_PATH: ${{ github.action_path }}
        CHECKOUT: ${{ github.workspace }}/pr
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/pollux-agent"
        workdir="$RUNNER_TEMP/pollux-agent-cwd"
        mkdir -p "$workdir"
        [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
        [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY

        if [ "$PR_NUMBER" = "0" ]; then
          schema_file="$ACTION_PATH/scaffold.schema.json"
          prompt="$(cat "$ACTION_PATH/scaffold.md")

        ## Repository

        - Repository checkout: $CHECKOUT
        - Commit: $HEAD_SHA (checked out there)
        - Default branch: $DEFAULT_BRANCH"
        else
          schema_file="$ACTION_PATH/result.schema.json"
          prompt="$(cat "$ACTION_PATH/prompt.md")

        ## Pull request

        - Number: $PR_NUMBER
        - Repository checkout: $CHECKOUT
        - Head commit: $HEAD_SHA (checked out there)
        - Default branch: $DEFAULT_BRANCH
        - Diff of the head against the merge base, unified format: $out/pr.diff"
        fi

        status=0
        cd "$workdir"
        claude -p "$prompt" \
          --output-format json \
          --json-schema "$(cat "$schema_file")" \
          --tools Read,Grep,Glob \
          --permission-mode default \
          --setting-sources user \
          --strict-mcp-config \
          --disallowedTools Bash,Edit,Write,WebFetch,WebSearch,NotebookEdit,Task \
          --add-dir "$CHECKOUT" \
          --add-dir "$out" \
          < /dev/null > "$out/claude.json" || status=$?

        jq -n --arg head_sha "$HEAD_SHA" --arg nonce "$NONCE" --rawfile raw "$out/claude.json" \
          '{head_sha: $head_sha, nonce: $nonce,
            claude: ($raw | try fromjson catch {is_error: true, result: "claude produced no JSON output"})}' \
          > "$out/result.json"
        exit "$status"

    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pollux-agent-result
        path: ${{ runner.temp }}/pollux-agent/result.json
        if-no-files-found: ignore
