services:
  pollux:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      DATABASE_PATH: /data/pollux.db
      ADDR: ":8080"
    volumes:
      - pollux-data:/data
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_FILE:?set GITHUB_APP_PRIVATE_KEY_FILE in .env}
        target: /run/secrets/github-app.pem
        read_only: true
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  pollux-data:
